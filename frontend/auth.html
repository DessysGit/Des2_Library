<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Des2 Library</title>
    <meta name="description" content="Sign in to Des2 Library to access your account, save favorite books, and write reviews.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://des2library.com/auth.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sign In | Des2 Library">
    <meta property="og:description" content="Access your Des2 Library account to save favorites and write reviews.">
    
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-container">
                    <h2 class="text-center text-success mb-4">Des2 Library</h2>
                    
                    <!-- Login Form -->
                    <div id="login-form" class="auth-form">
                        <h3 class="text-center mb-4">Sign In</h3>
                        <div id="login-messages"></div>
                        <form onsubmit="login(event)">
                            <div class="form-group">
                                <label for="login-email-username">Email or Username</label>
                                <input type="text" id="login-email-username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="javascript:void(0)" onclick="showForgotPasswordForm()">Forgot password?</a>
                        </div>
                        <div class="text-center mt-3">
                            <p>Don't have an account? <a href="javascript:void(0)" onclick="showRegisterForm()">Register</a></p>
                        </div>
                    </div>

                    <!-- Register Form -->
                    <div id="register-form" class="auth-form" style="display: none;">
                        <h3 class="text-center mb-4">Create Account</h3>
                        <div id="register-messages"></div>
                        <form onsubmit="register(event)">
                            <div class="form-group">
                                <label for="register-username">Username</label>
                                <input type="text" id="register-username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="register-email">Email</label>
                                <input type="email" id="register-email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="register-password">Password</label>
                                <input type="password" id="register-password" class="form-control" required>
                                <div class="password-strength">
                                    <div class="password-strength-bar" id="password-strength-bar"></div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="register-confirm-password">Confirm Password</label>
                                <input type="password" id="register-confirm-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-block">Create Account</button>
                        </form>
                        <div class="text-center mt-3">
                            <p>Already have an account? <a href="javascript:void(0)" onclick="showLoginForm()">Sign In</a></p>
                        </div>
                    </div>

                    <!-- Resend Verification Modal -->
                    <div id="resend-verification-modal" class="auth-form" style="display: none;">
                        <h3 class="text-center mb-4">Resend Verification Email</h3>
                        <div id="resend-messages"></div>
                        <form onsubmit="resendVerification(event)">
                            <div class="form-group">
                                <label for="resend-email">Email</label>
                                <input type="email" id="resend-email" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning btn-block">Resend Verification</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="javascript:void(0)" onclick="hideResendVerification()">Back to Login</a>
                        </div>
                    </div>

                    <!-- Forgot Password Modal -->
                    <div id="forgot-password-modal" class="auth-form" style="display: none;">
                        <h3 class="text-center mb-4">Reset Password</h3>
                        <div id="forgot-password-messages"></div>
                        <form onsubmit="requestPasswordReset(event)">
                            <div class="form-group">
                                <label for="forgot-password-email">Email</label>
                                <input type="email" id="forgot-password-email" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-danger btn-block">Send Reset Link</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="javascript:void(0)" onclick="hideForgotPasswordForm()">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-4" id="auth-footer">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>&copy; 2026 Des2 Library. All rights reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
