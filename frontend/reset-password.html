<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Des2 Library</title>
    <meta name="description" content="Reset your Des2 Library password.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://des2library.com/reset-password.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Reset Password | Des2 Library">
    <meta property="og:description" content="Reset your Des2 Library password.">
    
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-container">
                    <h2 class="text-center text-success mb-4">Des2 Library</h2>
                    <div id="reset-messages"></div>
                    <div class="card">
                        <div class="card-body">
                            <h3 class="text-center mb-4">Reset Password</h3>
                            <form onsubmit="resetPassword(event)">
                                <div class="form-group">
                                    <label for="reset-password">New Password</label>
                                    <input type="password" id="reset-password" class="form-control" required minlength="6">
                                </div>
                                <div class="form-group">
                                    <label for="confirm-reset-password">Confirm New Password</label>
                                    <input type="password" id="confirm-reset-password" class="form-control" required minlength="6">
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
