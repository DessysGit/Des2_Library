<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Des2 Library</title>
    <meta name="description" content="Admin dashboard for managing books, users, and viewing analytics on Des2 Library.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://des2library.com/admin-dashboard.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Admin Dashboard | Des2 Library">
    <meta property="og:description" content="Manage your library's books, users, and view analytics.">
    
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="dashboard-container">
                    <h1 class="text-center text-success mb-4">📊 Admin Dashboard</h1>
                    
                    <!-- Stats Cards -->
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-icon users-icon">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="total-users">0</h3>
                                <p>Total Users</p>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon books-icon">
                                <i class="fas fa-book"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="total-books">0</h3>
                                <p>Total Books</p>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon reviews-icon">
                                <i class="fas fa-star"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="total-reviews">0</h3>
                                <p>Total Reviews</p>
                            </div>
                        </div>
                        
                        <div class="stat-card">
                            <div class="stat-icon active-icon">
                                <i class="fas fa-user-check"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="active-users">0</h3>
                                <p>Active Users</p>
                            </div>
                        </div>
                    </div>

                    <!-- Charts Section -->
                    <div class="charts-grid">
                        <!-- Genre Distribution -->
                        <div class="chart-card">
                            <h3>Genre Distribution</h3>
                            <canvas id="genreChart"></canvas>
                        </div>
                        
                        <!-- Growth Chart -->
                        <div class="chart-card full-width">
                            <h3>User & Book Growth</h3>
                            <canvas id="growthChart"></canvas>
                        </div>
                        
                        <!-- Rating Distribution -->
                        <div class="chart-card">
                            <h3>Rating Distribution</h3>
                            <canvas id="ratingChart"></canvas>
                        </div>
                        
                        <!-- Review Trends -->
                        <div class="chart-card full-width">
                            <h3>Review Trends</h3>
                            <canvas id="reviewTrendChart"></canvas>
                        </div>
                    </div>

                    <!-- Popular Books & Recent Activity -->
                    <div class="info-grid">
                        <!-- Popular Books -->
                        <div class="info-card">
                            <h3>🔥 Popular Books</h3>
                            <div id="popular-books">
                                <p class="text-center text-muted">Loading...</p>
                            </div>
                        </div>
                        
                        <!-- Recent Activity -->
                        <div class="info-card">
                            <h3>📈 Recent Activity</h3>
                            <div id="recent-activity">
                                <p class="text-center text-muted">Loading...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Top Reviewers & Books Without Reviews -->
                    <div class="info-grid">
                        <!-- Top Reviewers -->
                        <div class="info-card">
                            <h3>⭐ Top Reviewers</h3>
                            <div id="top-reviewers">
                                <p class="text-center text-muted">Loading...</p>
                            </div>
                        </div>
                        
                        <!-- Books Without Reviews -->
                        <div class="info-card">
                            <h3>📚 Books Needing Reviews</h3>
                            <div id="books-without-reviews">
                                <p class="text-center text-muted">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
